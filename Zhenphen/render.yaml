services:
  - type: web
    name: zhenphen
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zhenphen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "true"
      - key: SSU_ADMIN_EMAIL
        sync: false
      - key: SSU_ADMIN_PASSWORD
        sync: false
      - key: SSU_ADMIN_NAME
        value: SSU Coordinator
      - key: SITE_ADMIN_EMAIL
        sync: false
      - key: SITE_ADMIN_PASSWORD
        sync: false
      - key: SITE_ADMIN_NAME
        value: Zhenphen Administrator

databases:
  - name: zhenphen-db
    databaseName: zhenphen
    user: zhenphen
    region: singapore
    plan: basic-256mb
